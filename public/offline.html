<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No connection · Royalty Apartments</title>
  <meta name="theme-color" content="#123fdc">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Shown by the app when there is no internet connection. Self-contained, so it works offline. */
    :root { --bg: #0a0d22; --card: #151a3a; --ink: #eef1fa; --muted: #aab3d6; --blue: #123fdc; --red: #f20d1d; }
    @media (prefers-color-scheme: light) { :root { --bg: #f4f6fb; --card: #ffffff; --ink: #121a2e; --muted: #5c667d; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    .card { width: 100%; max-width: 380px; text-align: center; background: var(--card); border-radius: 20px;
            padding: 32px 24px; border-top: 4px solid var(--blue); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
    img { width: 96px; height: 96px; margin-bottom: 12px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--red); border: 0; border-radius: 10px;
             padding: 12px 22px; cursor: pointer; width: 100%; }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="card">
    <img src="/favicon.svg" alt="" width="96" height="96">
    <h1>You are offline</h1>
    <p>Royalty Apartments needs an internet connection to show your room, payments and reports. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Reload by itself as soon as the connection comes back.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
